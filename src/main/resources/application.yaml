spring:
  application:
    name: wallet
  main:
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: wallet
        protocol: stateless
        capabilities:
          prompt: false
          resource: false
          completion: false

logging:
  structured:
    format:
      console: ecs

wallet:
  cnb:
    connect-timeout: 2s
    read-timeout: 5s
